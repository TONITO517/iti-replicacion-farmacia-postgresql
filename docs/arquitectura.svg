<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura de replicación bidireccional para dos farmacias</title>
  <desc id="descripcion">Dos sucursales usan nodos PostgreSQL activos que publican y reciben cambios. pgAdmin administra ambos nodos. La conexión replica cambios en ambas direcciones.</desc>
  <defs>
    <marker id="flecha-azul" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1769AA"/>
    </marker>
    <marker id="flecha-verde" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#138A72"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172B4D; }
      .titulo { font-size: 30px; font-weight: 700; }
      .subtitulo { font-size: 16px; fill: #52657A; }
      .sede { font-size: 21px; font-weight: 700; }
      .etiqueta { font-size: 15px; fill: #52657A; }
      .nodo { font-size: 19px; font-weight: 700; }
      .nota { font-size: 14px; }
      .pequeno { font-size: 13px; fill: #52657A; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="22" fill="#F5F8FC"/>
  <text x="600" y="55" text-anchor="middle" class="titulo">Replicación bidireccional en una cadena de farmacias</text>
  <text x="600" y="84" text-anchor="middle" class="subtitulo">Demostración académica con dos sucursales y dos nodos activos</text>

  <rect x="56" y="118" width="390" height="300" rx="18" fill="#FFFFFF" stroke="#B7C8D9" stroke-width="2"/>
  <rect x="754" y="118" width="390" height="300" rx="18" fill="#FFFFFF" stroke="#B7C8D9" stroke-width="2"/>
  <text x="251" y="158" text-anchor="middle" class="sede">Sede A · Farmacia Centro</text>
  <text x="949" y="158" text-anchor="middle" class="sede">Sede B · Farmacia Norte</text>

  <circle cx="145" cy="228" r="22" fill="#E8F1FA" stroke="#1769AA" stroke-width="2"/>
  <path d="M107 300 C111 270 179 270 183 300" fill="#E8F1FA" stroke="#1769AA" stroke-width="2"/>
  <text x="145" y="331" text-anchor="middle" class="etiqueta">Personal</text>
  <path d="M195 247 H232" fill="none" stroke="#73879B" stroke-width="2.5" marker-end="url(#flecha-azul)"/>

  <rect x="244" y="196" width="170" height="132" rx="14" fill="#EAF3FB" stroke="#1769AA" stroke-width="2.5"/>
  <ellipse cx="329" cy="224" rx="37" ry="11" fill="#FFFFFF" stroke="#1769AA" stroke-width="2"/>
  <path d="M292 224 V267 C292 273 309 278 329 278 C349 278 366 273 366 267 V224" fill="#FFFFFF" stroke="#1769AA" stroke-width="2"/>
  <ellipse cx="329" cy="267" rx="37" ry="11" fill="#FFFFFF" stroke="#1769AA" stroke-width="2"/>
  <text x="329" y="304" text-anchor="middle" class="nodo">Nodo A PostgreSQL</text>
  <text x="329" y="350" text-anchor="middle" class="pequeno">Puerto local 5433</text>

  <rect x="786" y="196" width="170" height="132" rx="14" fill="#EAF7F3" stroke="#138A72" stroke-width="2.5"/>
  <ellipse cx="871" cy="224" rx="37" ry="11" fill="#FFFFFF" stroke="#138A72" stroke-width="2"/>
  <path d="M834 224 V267 C834 273 851 278 871 278 C891 278 908 273 908 267 V224" fill="#FFFFFF" stroke="#138A72" stroke-width="2"/>
  <ellipse cx="871" cy="267" rx="37" ry="11" fill="#FFFFFF" stroke="#138A72" stroke-width="2"/>
  <text x="871" y="304" text-anchor="middle" class="nodo">Nodo B PostgreSQL</text>
  <text x="871" y="350" text-anchor="middle" class="pequeno">Puerto local 5434</text>

  <path d="M1005 247 H968" fill="none" stroke="#73879B" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <circle cx="1055" cy="228" r="22" fill="#E8F7F2" stroke="#138A72" stroke-width="2"/>
  <path d="M1017 300 C1021 270 1089 270 1093 300" fill="#E8F7F2" stroke="#138A72" stroke-width="2"/>
  <text x="1055" y="331" text-anchor="middle" class="etiqueta">Personal</text>

  <path d="M464 235 H736" fill="none" stroke="#1769AA" stroke-width="4" marker-end="url(#flecha-azul)"/>
  <path d="M736 276 H464" fill="none" stroke="#138A72" stroke-width="4" marker-end="url(#flecha-verde)"/>
  <rect x="511" y="200" width="178" height="35" rx="17" fill="#FFFFFF" stroke="#D5E0EA"/>
  <text x="600" y="223" text-anchor="middle" class="nota" font-weight="700">Cambios A hacia B</text>
  <rect x="511" y="280" width="178" height="35" rx="17" fill="#FFFFFF" stroke="#D5E0EA"/>
  <text x="600" y="303" text-anchor="middle" class="nota" font-weight="700">Cambios B hacia A</text>
  <text x="600" y="345" text-anchor="middle" class="pequeno">Publicación y suscripción en ambos nodos</text>
  <text x="600" y="370" text-anchor="middle" class="pequeno">Sincronización lógica asíncrona</text>

  <rect x="155" y="450" width="890" height="68" rx="14" fill="#FFF8E8" stroke="#E8C879" stroke-width="1.5"/>
  <text x="600" y="478" text-anchor="middle" class="nota" font-weight="700">Reglas de la demostración</text>
  <text x="600" y="501" text-anchor="middle" class="nota">Cada sede actualiza su propio inventario · Las ventas usan UUID · Los conflictos de claves se revisan y corrigen</text>

  <rect x="457" y="548" width="286" height="54" rx="13" fill="#EEF1F8" stroke="#7E8FA8" stroke-width="1.5"/>
  <text x="600" y="572" text-anchor="middle" class="nodo">pgAdmin 4</text>
  <text x="600" y="590" text-anchor="middle" class="pequeno">Administración y consultas de los dos nodos</text>
  <path d="M505 548 L380 418" fill="none" stroke="#7E8FA8" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M695 548 L820 418" fill="none" stroke="#7E8FA8" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
